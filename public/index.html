<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalog Image Processor</title>
  <meta name="description" content="Batch product image background removal and centering on square catalog canvas.">
  <meta name="theme-color" content="#121212">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand-section">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </div>
        <h1 class="brand-title">Catalog Image Processor</h1>
      </div>
    </header>

    <!-- Main Content -->
    <main>
      <!-- Control Settings -->
      <section class="settings-panel" aria-label="Processing Settings">
        <div class="settings-header">
          <div class="settings-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
            Settings
          </div>
        </div>

        <div class="settings-grid">
          <div class="control-group">
            <label class="control-label" for="select-size">Canvas Size</label>
            <select id="select-size" class="control-select">
              <option value="1000" selected>1000 × 1000 px</option>
              <option value="800">800 × 800 px</option>
              <option value="1200">1200 × 1200 px</option>
              <option value="1500">1500 × 1500 px</option>
            </select>
          </div>

          <div class="control-group">
            <label class="control-label" for="slider-padding">
              Padding
              <span class="val-tag" id="val-padding">10%</span>
            </label>
            <input type="range" id="slider-padding" class="range-slider" min="5" max="25" value="10" step="1">
          </div>

          <div class="control-group">
            <label class="control-label" for="select-bg">Background</label>
            <select id="select-bg" class="control-select">
              <option value="#FFFFFF" selected>White (#FFFFFF)</option>
              <option value="#F8F9FA">Off-White (#F8F9FA)</option>
              <option value="#FAF7F2">Warm White (#FAF7F2)</option>
              <option value="transparent">Transparent</option>
            </select>
          </div>

          <div class="control-group">
            <label class="control-label" for="select-format">Output Format</label>
            <select id="select-format" class="control-select">
              <option value="image/jpeg" selected>JPEG (92% Quality)</option>
              <option value="image/png">PNG</option>
              <option value="image/webp">WebP</option>
            </select>
          </div>
        </div>
      </section>

      <!-- Dropzone Upload Area -->
      <section class="dropzone-container">
        <input type="file" id="file-input" multiple accept="image/*" style="display: none;">
        
        <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Drop product images here">
          <div class="dropzone-icon-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
          </div>
          <div class="dropzone-prompt">Drop product images here</div>
          <div class="dropzone-subtext">PNG, JPG, WebP</div>

          <div class="dropzone-actions">
            <button type="button" class="btn btn-primary" id="btn-select-files">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
              Select Images
            </button>
          </div>
        </div>
      </section>

      <!-- Batch Action Ribbon & Stats -->
      <section class="batch-bar" aria-label="Batch Controls">
        <div class="batch-bar-main">
          <div class="stats-group">
            <div class="stat-item">
              <span class="stat-num" id="stat-total">0</span>
              <span class="stat-label">Total</span>
            </div>
            <div class="stat-item">
              <span class="stat-num active" id="stat-queued">0</span>
              <span class="stat-label">Queued</span>
            </div>
            <div class="stat-item">
              <span class="stat-num" id="stat-processing" style="color: var(--accent-cyan);">0</span>
              <span class="stat-label">Processing</span>
            </div>
            <div class="stat-item">
              <span class="stat-num done" id="stat-completed">0</span>
              <span class="stat-label">Completed</span>
            </div>
          </div>

          <div class="batch-buttons">
            <button type="button" class="btn btn-primary" id="btn-start-batch" disabled>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
              Process Queue
            </button>
            <div class="batch-sub-row">
              <button type="button" class="btn btn-secondary" id="btn-clear-queue" disabled>
                Clear
              </button>
              <button type="button" class="btn btn-success" id="btn-download-zip" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Download ZIP
              </button>
            </div>
          </div>
        </div>

        <div class="master-progress-bar-wrap" id="master-progress-bar-wrap">
          <div class="master-progress-bar-fill" id="master-progress-bar-fill"></div>
        </div>
      </section>

      <!-- Cards Grid -->
      <section class="cards-grid" id="cards-grid" aria-label="Product Queue">
        <div class="empty-state" id="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
          <p>No images in queue. Drop images above or click Select Images.</p>
        </div>
      </section>
    </main>

    <!-- Inspection Modal -->
    <div class="modal-overlay" id="compare-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title" id="modal-title">Inspection</h2>
          <button class="btn-icon" id="modal-close" aria-label="Close Modal">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>

        <div class="modal-body">
          <div class="modal-compare-panel">
            <div class="modal-compare-label">Original</div>
            <div class="modal-compare-box">
              <img id="modal-img-original" src="" alt="Original Image">
            </div>
          </div>

          <div class="modal-compare-panel">
            <div class="modal-compare-label">Processed Result</div>
            <div class="modal-compare-box">
              <img id="modal-img-result" src="" alt="Processed Result Image">
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Application Logic -->
  <script type="module" src="app.js"></script>
</body>
</html>
